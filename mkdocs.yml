site_name: fieldsim
site_description: Virtual Modbus, OPC UA and S7 devices for testing industrial software without hardware.
site_url: https://enesuslu15.github.io/fieldsim/
repo_url: https://github.com/enesuslu15/fieldsim
repo_name: enesuslu15/fieldsim
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Device files: guide/devices.md
      - Generators: guide/generators.md
      - Faults and outages: guide/faults.md
      - Scenarios and virtual time: guide/scenarios.md
      - pytest plugin: guide/pytest.md
      - Command line: guide/cli.md
      - Docker and CI: guide/docker-ci.md
  - Reference:
      - Configuration file: reference/configuration.md
      - Python API: reference/api.md
  - Internals:
      - Architecture: architecture.md
      - Adding a protocol: adding-a-protocol.md
  - Changelog: changelog.md
  - Contributing: contributing.md

hooks:
  - docs/hooks/config_reference.py

exclude_docs: |
  hooks/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            docstring_style: sphinx
            filters: ["!^_"]
            merge_init_into_class: true
